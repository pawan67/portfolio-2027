# Deployed by Dokploy in Compose mode, so the service definition lives in git
# rather than in Dokploy's database. Dokploy supplies DOMAIN and TAG.
services:
  web:
    image: ${IMAGE:-ghcr.io/pawan67/portfolio-2027}:${TAG:-latest}

    # `docker compose up` reuses a tag it already holds locally, so redeploying
    # :latest silently kept serving the previous image -- including, once, an
    # amd64 one on this arm64 host. CI moves :latest on every push, so the local
    # copy is exactly the thing that must not be trusted.
    pull_policy: always

    environment:
      PORT: "8080"
      RUM_DATA: /data/rum.json
      # Origin of the site itself, used for CORS on the /api/ping timing probe.
      SITE_ORIGIN: "https://${DOMAIN}"
      # Host CPU, memory, load and uptime come from /proc, which Docker does not
      # namespace, so they need no extra mounts.
      #
      # Disk is different: statfs inside the container measures the overlay
      # filesystem, which is meaningless. Reporting host disk means bind-mounting
      # a host path, and mounting host root into an internet-facing container is
      # a real trade rather than a free one. Left off by default; if you enable
      # it, mount the narrowest useful path read-only rather than /.
      # METRICS_DISK_PATH: /hostfs

    volumes:
      - rum-data:/data

    healthcheck:
      # The image is `scratch`; the binary probes itself.
      test: ["CMD", "/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 2s

    deploy:
      # Deliberately one replica. The field-data checkpoint is a single file on
      # a shared volume, and two replicas would each hold their own in-memory
      # histograms and overwrite each other on flush. Zero-downtime deploys do
      # not depend on replica count -- start-first below is what provides them.
      #
      # The one window where two tasks briefly coexist is a rolling deploy. At a
      # 60s flush interval that can drop at most a few samples, which is
      # immaterial to a percentile over 28 days.
      replicas: 1
      update_config:
        # start-first is what makes a deploy zero-downtime: the new task must
        # pass its healthcheck before the old one is stopped.
        order: start-first
        parallelism: 1
        delay: 5s
        failure_action: rollback
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 64M
        reservations:
          memory: 16M

    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio.loadbalancer.server.port=8080
      # Grey-clouded hostname for the /perf edge-versus-origin comparison. It
      # bypasses Cloudflare, so Traefik has to terminate TLS for it directly.
      - traefik.http.routers.portfolio-origin.rule=Host(`origin.${DOMAIN}`)
      - traefik.http.routers.portfolio-origin.entrypoints=websecure
      - traefik.http.routers.portfolio-origin.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-origin.service=portfolio
      # Traefik must not re-compress: bodies are already brotli/zstd from disk.
      - traefik.http.services.portfolio.loadbalancer.passhostheader=true

    networks:
      - dokploy-network

volumes:
  rum-data:

networks:
  dokploy-network:
    external: true
