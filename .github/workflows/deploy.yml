name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Swarm service.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp build time
        id: stamp
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Build off the VPS so the origin never spends CPU on CI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The VPS is arm64; the runner is amd64. Without this the image builds
          # for the runner and dies on the target with "exec format error".
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            PUBLIC_ORIGIN_URL=${{ vars.PUBLIC_ORIGIN_URL }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Dokploy's deploy webhook validates the push against the branch
      # configured on the app, and answers 301 "Branch Not Match" when it cannot
      # find one in the payload. A 301 is not a failure to `curl -f`, so the old
      # `{"tag": ...}` body left this step green while no rollout ever happened.
      # It reads the branch the way GitHub sends it, and ignores a tag entirely:
      # which image to pull is decided by TAG in the compose environment.
      - name: Trigger Dokploy rollout
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          REF: ${{ github.ref_name }}
        run: |
          [ -n "$WEBHOOK_URL" ] || { echo "DOKPLOY_WEBHOOK_URL is not set"; exit 1; }
          code=$(curl -sS -o "$RUNNER_TEMP/dokploy.txt" -w '%{http_code}' \
            -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d "{\"ref\":\"refs/heads/$REF\"}")
          echo "dokploy replied $code: $(cat "$RUNNER_TEMP/dokploy.txt")"
          case "$code" in 2??) ;; *) exit 1 ;; esac

      # HTML is cached at the edge with s-maxage=31536000, so a deploy is only
      # live once the edge is purged.
      - name: Purge Cloudflare cache
        env:
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # An unset secret interpolates to nothing rather than erroring, which
          # turned this into a POST to /zones//purge_cache: a 404 that reads
          # like a wrong zone id instead of a missing one.
          [ -n "$ZONE_ID" ] || { echo "CLOUDFLARE_ZONE_ID is not set"; exit 1; }
          [ -n "$API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          # -f would suppress the body, and Cloudflare puts the reason in it.
          body=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"purge_everything":true}')
          echo "$body"
          case "$(printf '%s' "$body" | tr -d ' ')" in
            *'"success":true'*) ;;
            *) exit 1 ;;
          esac

      - name: Verify the deploy is actually live
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS "${{ vars.SITE_URL }}/api/build" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "live on ${{ github.sha }} after ${i}0s"
              exit 0
            fi
            echo "attempt $i: serving ${live:-unknown}"
            sleep 10
          done
          echo "deploy did not go live within 300s"; exit 1

      # A green deploy should mean the production origin still behaves the way
      # the repo says it does, not merely that the container started.
      - name: Audit production
        run: python3 scripts/audit.py "${{ vars.SITE_URL }}"
