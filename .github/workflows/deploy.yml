name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race for the same Swarm service.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp build time
        id: stamp
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Build off the VPS so the origin never spends CPU on CI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            PUBLIC_ORIGIN_URL=${{ vars.PUBLIC_ORIGIN_URL }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.stamp.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trigger Dokploy rollout
        run: |
          curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{"tag":"${{ github.sha }}"}'

      # HTML is cached at the edge with s-maxage=31536000, so a deploy is only
      # live once the edge is purged.
      - name: Purge Cloudflare cache
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H 'Content-Type: application/json' \
            -d '{"purge_everything":true}'

      - name: Verify the deploy is actually live
        run: |
          for i in $(seq 1 30); do
            live=$(curl -fsS "${{ vars.SITE_URL }}/api/build" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            if [ "$live" = "${{ github.sha }}" ]; then
              echo "live on ${{ github.sha }} after ${i}0s"
              exit 0
            fi
            echo "attempt $i: serving ${live:-unknown}"
            sleep 10
          done
          echo "deploy did not go live within 300s"; exit 1
